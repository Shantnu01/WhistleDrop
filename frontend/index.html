<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhistleDrop | Speak Without Being Seen</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Using a bold, quirky font similar to NoDeck -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="slides">
    <section class="slide is-active" id="cover-slide">
      <div class="container">
        <h1 class="slide__eyebrow">Speak Without Being Seen.</h1>
        <div class="logo">WHISTLE<br>DROP</div>
        <p class="slide__tagline">An anonymous reporting system that <span class="text-highlight">protects you</span>, not them.</p>
        
        <div class="action-buttons">
          <button class="btn btn-primary" id="btn-show-submit">Submit a Report</button>
          <button class="btn btn-secondary" id="btn-show-track">Track a Case</button>
        </div>
        <div style="margin-top: 2rem;">
          <a href="admin.html" style="color: #000; font-family: var(--font-body); font-weight: 800; text-decoration: underline;">Moderator Login</a>
        </div>
      </div>
    </section>

    <!-- Submit Report Section -->
    <section class="slide" id="submit-slide" style="display: none;">
      <div class="container container-form">
        <button class="btn-back" onclick="showSlide('cover-slide')">← Back</button>
        <h2>Submit Report</h2>
        <form id="submit-form">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="SECURITY">Security</option>
              <option value="HARASSMENT">Harassment</option>
              <option value="CORRUPTION">Corruption</option>
              <option value="TECHNICAL">Technical</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="5" required minlength="10" placeholder="Tell us what happened..."></textarea>
          </div>
          <div class="form-group">
            <label for="evidenceUrl">Evidence URL (Optional)</label>
            <input type="url" id="evidenceUrl" placeholder="https://...">
          </div>
          <button type="submit" class="btn btn-primary">Submit Anonymously</button>
        </form>

        <div id="submit-result" class="result-box" style="display: none;">
          <h3>Report Submitted!</h3>
          <p>Please save this case code securely. It is the ONLY way to check your report status.</p>
          <div class="case-code" id="generated-case-code"></div>
        </div>
      </div>
    </section>

    <!-- Track Report Section -->
    <section class="slide" id="track-slide" style="display: none;">
      <div class="container container-form">
        <button class="btn-back" onclick="showSlide('cover-slide')">← Back</button>
        <h2>Track a Case</h2>
        <form id="track-form">
          <div class="form-group">
            <label for="caseCode">Enter your Case Code</label>
            <input type="text" id="caseCode" required placeholder="XXXX-XXXX-XXXX">
          </div>
          <button type="submit" class="btn btn-secondary">Check Status</button>
        </form>

        <div id="track-result" class="result-box" style="display: none;">
          <h3>Case Status: <span id="status-badge" class="badge"></span></h3>
          <p>Category: <strong id="track-category"></strong> | Submitted: <strong id="track-date"></strong></p>
          
          <div id="updates-container" class="updates-timeline">
            <!-- Updates injected here via JS -->
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
