version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: whistledrop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whistledrop
    ports:
      - "5454:5432"
    volumes:
      # Auto-run the initialization script when the container starts for the first time
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: whistledrop-redis
    ports:
      - "6380:6379"
